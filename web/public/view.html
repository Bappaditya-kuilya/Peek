<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --bg: #ffffff;
        --panel: #ffffff;
        --soft-cloud: #f5f5f5;
        --panel-border: #cacacb;
        --hairline-soft: #e5e5e5;
        --text: #111111;
        --muted: #707072;
        --warning-text: #39393b;
        --danger: #d30005;
        --font-display: "Bebas Neue", "Helvetica Neue", Arial, sans-serif;
        --font-sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      #app {
        min-height: 100vh;
        padding: 40px 24px;
      }

      .shell {
        width: min(980px, 100%);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .panel {
        border: 1px solid var(--panel-border);
        border-radius: 0;
        background: var(--panel);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 24px;
      }

      .wordmark {
        font-family: var(--font-display);
        font-size: 28px;
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .timer {
        font-family: var(--font-mono);
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }

      .warning {
        padding: 14px 18px;
        background: var(--soft-cloud);
        border-left: 3px solid var(--warning-text);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
      }

      .content {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .title {
        margin: 0;
        font-family: var(--font-sans);
        font-size: 28px;
        font-weight: 500;
        line-height: 1.1;
        letter-spacing: -0.01em;
      }

      .meta {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .viewer {
        min-height: 320px;
        padding: 18px;
        background: var(--soft-cloud);
        overflow: auto;
      }

      .viewer img,
      .viewer canvas {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
        border-radius: 0;
      }

      .pdf-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .status {
        padding: 40px 24px;
        text-align: center;
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .download-block {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
        padding: 24px;
      }

      .download-button {
        display: inline-block;
        padding: 14px 22px;
        background: var(--text);
        color: #ffffff;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        border: 1px solid var(--text);
      }

      .download-button:hover {
        background: #000000;
      }

      #watermark {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        color: rgba(0, 0, 0, 0.14);
        font-size: 22px;
        font-weight: 700;
        transform: rotate(-32deg);
        background: repeating-linear-gradient(
          transparent 0px,
          transparent 80px,
          rgba(0, 0, 0, 0.06) 80px,
          rgba(0, 0, 0, 0.06) 160px
        );
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }

      @media (max-width: 640px) {
        #app { padding: 14px; }
        .title { font-size: 24px; }
        .content, .header { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="watermark">PEEK • TEMPORARY SHARE • EXPIRES SOON • PEEK • TEMPORARY SHARE • EXPIRES SOON</div>
    <script type="module" src="/view.js"></script>
  </body>
  </html>
