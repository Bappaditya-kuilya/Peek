<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Peek — Secure browser transfer for shared devices</title>
    <meta
      name="description"
      content="Peek is a secure browser-based transfer workspace for shared computers. Scan a QR or use a short code to move files with encrypted relay fallback and temporary sessions."
    />
    <meta
      name="keywords"
      content="file transfer, qr file transfer, send files without app, webrtc file transfer, end-to-end encrypted file sharing, open source file transfer, no install file sharing, shared computer file transfer, p2p file transfer, transfer files to public pc"
    />
    <meta name="author" content="Bappaditya Kuilya" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://peek.dev/" />

    <!-- Icons / manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Peek" />
    <meta property="og:title" content="Peek — Secure browser transfer for shared devices" />
    <meta
      property="og:description"
      content="Secure browser-based file transfer for shared and public computers with encrypted relay fallback, temporary sessions, and no install."
    />
    <meta property="og:url" content="https://peek.dev/" />
    <meta property="og:image" content="https://peek.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Peek secure browser transfer workspace." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Peek — Secure browser transfer for shared devices" />
    <meta
      name="twitter:description"
      content="Secure browser-based file transfer for shared computers with temporary sessions and encrypted relay fallback."
    />
    <meta name="twitter:image" content="https://peek.dev/og.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Peek",
        "url": "https://peek.dev/",
        "description": "Secure browser-based transfer workspace for shared and public computers with encrypted relay fallback and temporary sessions.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern browser with WebRTC.",
        "license": "https://opensource.org/licenses/MIT",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Zero-install browser-to-browser file transfer",
          "QR code or 6-digit code pairing",
          "End-to-end AES-GCM encryption",
          "Two-way transfer",
          "Download all as ZIP",
          "Sessions auto-expire in 60 minutes"
        ],
        "author": {
          "@type": "Person",
          "name": "Bappaditya Kuilya"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
