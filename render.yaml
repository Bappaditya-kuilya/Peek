# Render Blueprint for the Peek relay (free tier, no card required).
#
# Deploy: https://dashboard.render.com → New → Blueprint → connect this repo.
# Render reads this file and provisions the relay as a free web service.
#
# Note on the free tier: the instance spins down after ~15 min of inactivity
# and cold-starts (a few seconds) on the next request. Fine for short transfer
# sessions. WebSockets are supported on free web services.
services:
  - type: web
    name: peek-relay
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./relay/Dockerfile
    dockerContext: ./relay
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render terminates TLS in front of the app (one proxy hop).
      - key: TRUST_PROXY
        value: "1"
      # Exact frontend origins allowed to use the relay. Update if your Vercel
      # domain differs. The "*.vercel.app" wildcard covers preview deploys.
      - key: ALLOWED_ORIGINS
        value: "https://peekapp.vercel.app,https://*.vercel.app"
