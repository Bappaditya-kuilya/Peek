services:
  - type: web
    name: peek-relay
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./relay/Dockerfile
    dockerContext: ./relay
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: "https://peekapp.vercel.app,https://*.vercel.app"
