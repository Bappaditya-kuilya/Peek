name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare-relay/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: cloudflare-relay
      - name: Run tests
        run: npm test
        working-directory: cloudflare-relay
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: cloudflare-relay

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Run tests
        run: npm test
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web