name: Deploy Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "web/**"
      - "vercel.json"
      - ".github/workflows/deploy-web.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
